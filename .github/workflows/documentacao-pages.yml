name: Documentação MkDocs no GitHub Pages
on:
  push:
    branches: [documentacao]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/documentacao-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages-documentacao
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Instalar MkDocs
        run: python -m pip install -r requirements-docs.txt
      - name: Consultar configuração do Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Gerar documentação
        env:
          MKDOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/documentacao'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
