name: Testes Central Systech

# Verificação OBRIGATÓRIA para PRs na main (marcar "qualidade / validar" como required no GitHub).
# Sem filtro de caminhos de propósito: uma verificação obrigatória com "paths" não roda em PRs que não mexem
# naqueles arquivos, e o GitHub fica esperando por ela para sempre.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

jobs:
  qualidade:
    name: qualidade / validar
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências do lockfile
        run: npm ci
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Testes unitários, componentes e integração
        run: npm test
      - name: Build de produção
        run: npm run build
